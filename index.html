  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Fraunces"', 'Georgia', 'serif'],
          },
          colors: {
            alabaster: '#FDFCF8',
            card: '#FFFFFF',
            borderWarm: '#EAE6DC',
            ink: '#1E2923',
            muted: '#64726A',
            sage: '#3D7A5E',
            sageDark: '#2E6049',
            mint: '#EBF4EF',
            apricot: '#F4A261',
            apricotSoft: '#FEF3E8',
            apricotDark: '#D97B34',
          },
          boxShadow: {
            card: '0 4px 20px -4px rgba(30, 41, 35, 0.06)',
            float: '0 -6px 24px -4px rgba(30, 41, 35, 0.08)',
          }

    };
  </script>

  <style>
    html, body {
      background-color: #FDFCF8;
      color: #1E2923;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .pb-safe {
      padding-bottom: max(5.5rem, calc(4.75rem + env(safe-area-inset-bottom)));
    }
    .nav-safe {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.4; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet {
      animation: slideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes popTap {
      0% { transform: scale(0.94); }
      60% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .animate-tap {
      animation: popTap 0.18s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-alabaster text-ink selection:bg-mint selection:text-sage">

  <!-- Toast Banner -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">
    <div class="bg-ink text-alabaster px-4 py-2.5 rounded-2xl shadow-lg flex items-center justify-between gap-2 text-xs font-semibold">

      <span class="px-2 py-0.5 rounded-full bg-sage text-white text-[10px]">Done</span>

  </div>

  <!-- Slide-Up Bottom Sheet Modal (For Editing Workouts, Meals, or Confirmations) -->
  <div id="bottom-sheet-backdrop" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-ink/40 backdrop-blur-xs" onclick="closeBottomSheet(event)">
    <div id="bottom-sheet-panel" onclick="event.stopPropagation()" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl border-t sm:border border-borderWarm animate-sheet max-h-[88vh] overflow-y-auto">
      <div class="w-10 h-1 rounded-full bg-borderWarm mx-auto mb-3 sm:hidden"></div>

    </div>
  </div>

  <!-- Main App Shell -->
  <div class="max-w-2xl mx-auto min-h-screen flex flex-col">

    <!-- Compact Sunlit Header -->
    <header class="sticky top-0 z-30 bg-alabaster/95 backdrop-blur-md border-b border-borderWarm/80 px-4 pt-3.5 pb-2.5">
      <div class="flex items-center justify-between gap-3">
        <div>

        </div>

        <!-- Circular Progress Ring + Desktop Nav -->

          <!-- Desktop Tabs (Hidden on Mobile) -->

          </div>
        </div>
      </div>

      <!-- Day Selector Pills (Mon - Sun) -->
      <div id="day-pills-bar" class="mt-2.5 flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
        <!-- Rendered dynamically -->
      </div>
    </header>

    <!-- Dynamic Main Screen -->
    <main id="main-view" class="flex-1 px-4 pt-3.5 pb-safe space-y-3.5">
      <!-- Rendered dynamically -->
    </main>

    <!-- Streamlined 3-Tab Thumb-Friendly Bottom Bar (Mobile) -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-borderWarm shadow-float nav-safe px-4 pt-1.5">
      <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
        <button onclick="switchTab('today')" data-tab="today" class="mob-tab flex flex-col items-center justify-center py-1.5 rounded-2xl transition">

  </div>

  <script>
    /*************************************************************************
     * 1. STATE & CONCISE PRE-POPULATED DATA
     *************************************************************************/
    const STORAGE_KEY = 'daily_rhythm_v2_bright';
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const SHORT_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    function getTodayName() {
      const idx = new Date().getDay();
      return idx === 0 ? 'Sunday' : DAYS[idx - 1];
    }

    // Concise, scannable daily timeline items (3-6 word labels)
    const TIMELINE_ITEMS = [
      { id: 't1', time: '5:20 AM', label: 'Wake up & freshen up', icon: '🌅' },

      { id: 't5', time: '7:40 AM', label: 'Walk + Sattu & Iron', icon: '🍋', tip: 'Add lemon; wait 45m before tea' },

    // Default 5:45 AM Workouts per day
    const DEFAULT_WORKOUTS = {

    // Concise, exact Weekly Household Meal Plan (4 visual cards per day)

        lunch: 'Ariya & Family: Paneer bhurji sandwich, oranges & nuts\nYou: Office lunch',

      Saturday: {
        tag: 'Weekend',

        breakfast: 'All: Pongal and sambar + boiled eggs (2 adults / 1 Ariya)',
        lunch: 'All: Sambar, carrot-beans poriyal & mor kozhumbu',
        dinner: 'All: Dosa and tomato-onion chutney'
      },
      Sunday: {
        tag: 'Weekend',
        ariyaBox: 'Sunday Treat: Soya 65 alongside lunch',
        breakfast: 'All: Egg bhurji sandwich + boiled eggs (2 adults / 1 Ariya)',
        lunch: 'All: Paneer tikka, herbed rice with coconut milk & Soya 65',
        dinner: 'All: Idly and coconut chutney'
      }
    };

    const NIGHT_PREP_ITEMS = [
      { id: 'p1', label: 'Boil batch of eggs (2/adult, 1 Ariya)', tag: 'Protein' },
      { id: 'p2', label: 'Refill Sattu premix (Sattu + flax + jeera + black salt)', tag: '7:40 AM' },
      { id: 'p3', label: 'Chop veggies / prep paneer for morning box', tag: 'Kitchen' },
      { id: 'p4', label: 'Lay out 5:45 AM workout clothes & mat', tag: 'Morning' }
    ];

    function emptyDayLog() {
      return {
        eggs: 0,
        tea: 0,
        walks: 0,
        smoothie: false,
        paneer: false,
        flexDay: false,
        tasks: {},
        prep: {}
      };
    }

    function createDefaultState() {
      const logs = {};
      DAYS.forEach(d => { logs[d] = emptyDayLog(); });
      return {
        activeTab: 'today',
        selectedDay: getTodayName(),
        workouts: JSON.parse(JSON.stringify(DEFAULT_WORKOUTS)),
        meals: JSON.parse(JSON.stringify(DEFAULT_MEALS)),
        logs
      };
    }

    let state = (function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        const def = createDefaultState();
        return {
          ...def,
          ...parsed,
          selectedDay: DAYS.includes(parsed.selectedDay) ? parsed.selectedDay : getTodayName(),
          workouts: { ...def.workouts, ...(parsed.workouts || {}) },
          meals: { ...def.meals, ...(parsed.meals || {}) },
          logs: DAYS.reduce((acc, d) => {
            acc[d] = { ...emptyDayLog(), ...(parsed.logs?.[d] || {}) };
            return acc;
          }, {})
        };
      } catch (e) {
        return createDefaultState();
      }
    })();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    /*************************************************************************
     * 2. BESPOKE WARM FLAT-VECTOR SVG ILLUSTRATIONS
     *************************************************************************/
    const SVG_ART = {

          <circle cx="96" cy="36" r="15" fill="#F4A261"/>

          <!-- Graceful Flowing Silhouette -->
          <circle cx="56" cy="34" r="7.5" fill="#2E6049"/>
          <path d="M32 52C42 46 50 45 57 46C65 47 74 42 83 36" stroke="#2E6049" stroke-width="5" stroke-linecap="round"/>
          <path d="M56 46L54 68L42 90" stroke="#3D7A5E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M55 66L70 78L68 92" stroke="#3D7A5E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="30" r="3" fill="#F4A261"/>
          <circle cx="122" cy="54" r="2.5" fill="#3D7A5E" fill-opacity="0.5"/>
        </svg>
      `,
      // Bento Box Icon
      bento: `
        <svg viewBox="0 0 44 44" class="w-10 h-10 shrink-0" fill="none">
          <rect width="44" height="44" rx="14" fill="#FEF3E8"/>
          <rect x="10" y="13" width="24" height="18" rx="5" fill="#F4A261"/>
          <line x1="22" y1="13" x2="22" y2="31" stroke="#FDFCF8" stroke-width="2"/>
          <line x1="22" y1="22" x2="34" y2="22" stroke="#FDFCF8" stroke-width="2"/>
          <circle cx="16" cy="22" r="3" fill="#FDFCF8"/>
        </svg>
      `,
      // Sunny Breakfast Plate Icon
      breakfast: `
        <svg viewBox="0 0 44 44" class="w-10 h-10 shrink-0" fill="none">
          <rect width="44" height="44" rx="14" fill="#EBF4EF"/>
          <circle cx="22" cy="23" r="11" fill="#FFFFFF" stroke="#3D7A5E" stroke-width="2"/>
          <circle cx="20" cy="22" r="4" fill="#F4A261"/>
          <path d="M26 19C28 21 28 25 26 27" stroke="#3D7A5E" stroke-width="2" stroke-linecap="round"/>
        </svg>
      `,
      // Wholesome Lunch Bowl Icon
      lunch: `
        <svg viewBox="0 0 44 44" class="w-10 h-10 shrink-0" fill="none">
          <rect width="44" height="44" rx="14" fill="#EBF4EF"/>
          <path d="M11 21H33C33 27.6274 27.6274 33 21 33H23C16.3726 33 11 27.6274 11 21Z" fill="#3D7A5E"/>
          <circle cx="18" cy="18" r="3" fill="#F4A261"/>
          <circle cx="25" cy="17" r="3.5" fill="#84B59F"/>
        </svg>
      `,
      // Cozy Dinner Plate Icon
      dinner: `
        <svg viewBox="0 0 44 44" class="w-10 h-10 shrink-0" fill="none">
          <rect width="44" height="44" rx="14" fill="#FEF3E8"/>
          <circle cx="22" cy="23" r="11" fill="#FFFFFF" stroke="#D97B34" stroke-width="2"/>
          <path d="M16 24C18 19 26 19 28 24" fill="#F4A261"/>
          <circle cx="29" cy="14" r="2" fill="#D97B34"/>
        </svg>
      `,
      // Night Prep Moon & Checklist Illustration
      nightPrep: `
        <svg viewBox="0 0 90 76" class="w-20 h-16 shrink-0" fill="none">
          <circle cx="48" cy="38" r="28" fill="#EBF4EF"/>
          <path d="M52 20C44 22 39 29 39 38C39 47 45 54 54 56C43 58 32 50 32 38C32 26 42 18 52 20Z" fill="#3D7A5E"/>

    };

    /*************************************************************************
     * 3. TOAST & SLIDE-UP BOTTOM SHEET HELPERS
     *************************************************************************/
    let toastTimeout = null;
    function showToast(msg) {
      const box = document.getElementById('toast-container');
      document.getElementById('toast-message').textContent = msg;
      box.classList.remove('opacity-0', '-translate-y-4');
      box.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        box.classList.add('opacity-0', '-translate-y-4');
        box.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function openBottomSheet(htmlContent) {
      const backdrop = document.getElementById('bottom-sheet-backdrop');
      document.getElementById('bottom-sheet-content').innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeBottomSheet(e) {
      if (e && e.target !== document.getElementById('bottom-sheet-backdrop')) return;
      const backdrop = document.getElementById('bottom-sheet-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function forceCloseSheet() {
      const backdrop = document.getElementById('bottom-sheet-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function lines(str) {
      return esc(str).replace(/\n/g, '<br/>');
    }

    /*************************************************************************
     * 4. NAVIGATION & HEADER PROGRESS RING
     *************************************************************************/
    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectDay(day) {
      state.selectedDay = day;
      saveState();
      render();
    }

    function renderHeader() {
      const day = state.selectedDay;
      const log = state.logs[day];
      const todayName = getTodayName();

      // Calculate daily completion (11 timeline tasks + 5 anchor goals = 16)
      const tasksDone = TIMELINE_ITEMS.filter(t => log.tasks[t.id]).length;
      const anchorsDone =
        (log.eggs >= 3 ? 1 : 0) +
        (log.tea >= 1 && log.tea <= (log.flexDay ? 3 : 2) ? 1 : 0) +
        (log.walks >= 2 ? 1 : 0) +
        (log.smoothie ? 1 : 0) +
        (log.paneer ? 1 : 0);

      const total = TIMELINE_ITEMS.length + 5;
      const done = tasksDone + anchorsDone;
      const pct = Math.round((done / total) * 100);
      const radius = 17;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (pct / 100) * circumference;

      document.getElementById('progress-ring-box').innerHTML = `
        <svg class="w-11 h-11 -rotate-90" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${radius}" stroke="#EAE6DC" stroke-width="3.5" fill="none" />
          <circle cx="21" cy="21" r="${radius}" stroke="#3D7A5E" stroke-width="3.5" fill="none"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"
            class="transition-all duration-300" />
        </svg>
        <span class="absolute text-[10px] font-extrabold text-ink">${pct}%</span>
      `;

      // Highlight active mobile & desktop tabs
      document.querySelectorAll('.mob-tab').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = active
          ? 'mob-tab flex flex-col items-center justify-center py-1.5 rounded-2xl transition bg-mint text-sage'

    function toggleNightPrep(prepId) {

    function copySyncCode() {
      try {
        const payload = JSON.stringify({ workouts: state.workouts, meals: state.meals, logs: state.logs });
        const encoded = btoa(unescape(encodeURIComponent(payload)));
        const box = document.getElementById('sync-box');
        box.value = encoded;
        box.select();
        box.setSelectionRange(0, 99999);
        document.execCommand('copy');
        showToast('Sync code copied! Paste into WhatsApp/Notes.');
      } catch (e) {
        showToast('Could not copy sync code');
      }
    }

    function loadSyncCode() {
      const raw = document.getElementById('sync-box').value.trim();
      if (!raw) {
        showToast('Paste a sync code first');
        return;
      }
      try {
        const parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if (!parsed.meals || !parsed.workouts) throw new Error('Invalid');
        state.workouts = parsed.workouts;
        state.meals = parsed.meals;
        if (parsed.logs) state.logs = parsed.logs;
        saveState();
        showToast('Synced from laptop!');
        switchTab('today');
      } catch (e) {
        showToast('Invalid sync code');
      }
    }

            <button onclick="loadSyncCode()" class="py-2.5 rounded-2xl bg-ink text-white text-xs font-bold hover:opacity-90 transition">
              Paste & Load
            </button>
          </div>
        </section>
      `;
    }

    /*************************************************************************
     * 8. MASTER RENDER
     *************************************************************************/
    function render() {
      renderHeader();
      if (state.activeTab === 'today') renderToday();
      else if (state.activeTab === 'meals') renderMeals();
      else renderPrepAndSync();
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
